# Local-only PostgreSQL for Radith's laptop. No pgAdmin container is needed.
name: aiesec-pu-crm-local
services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${CRM_DB_NAME:-crm_dev}
      POSTGRES_USER: ${CRM_DB_USER:-crm_app}
      POSTGRES_PASSWORD: ${CRM_DB_PASSWORD:?Set CRM_DB_PASSWORD in the git-ignored .env first}
    ports:
      - "127.0.0.1:${CRM_DB_PORT:-5433}:5432"
    volumes:
      - crm_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
volumes:
  crm_pgdata:
