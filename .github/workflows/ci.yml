name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded PR runs; never cancel a run already merged to main.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  quality-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Installs the pnpm version pinned in package.json `packageManager`
      # (currently pnpm@10.15.0); no version override is set here so the
      # repository config stays the single source of truth.
      - name: Install pinned pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      # Fails on any lockfile/package.json mismatch; never resolves fresh
      # versions, so CI builds exactly what contributors commit.
      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      # `pnpm lint` runs `biome check .`, which validates lint rules AND
      # formatting for all files in Biome's configured scope.
      - name: Lint and format check
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: Build web app
        run: pnpm --filter @crm/web build

      # Documentation-pack structure and the fixed 13-page diagram; stdlib
      # only, no network.
      - name: Handover and diagram validation
        run: python scripts/validate-handover.py

      # Blocking gate: fails the job on any prod dependency vulnerability
      # of severity high or critical. Needs registry network access.
      - name: Dependency security audit (high+ severity blocks)
        run: pnpm audit --prod --audit-level high
